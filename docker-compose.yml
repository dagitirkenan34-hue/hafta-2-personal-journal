services:
  mysql:
    image: mysql:8.4
    container_name: journal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootJournal_2026!
      MYSQL_DATABASE: personal_journal
      MYSQL_USER: journal_user
      MYSQL_PASSWORD: JournalApp_2026!
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
